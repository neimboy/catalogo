<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoShop - CRUD Productos</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>EcoShop</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="categorias.html">Categorías</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="crud.html">CRUD Productos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Gestión de Productos (CRUD)</h2>

        <!-- Formulario para CREAR y EDITAR -->
        <section>
            <h3>Formulario de Producto</h3>
            <form>
                <input type="hidden" id="producto-id">

                <div>
                    <label for="producto-nombre">Nombre:</label>
                    <input type="text" id="producto-nombre" placeholder="Nombre del producto" required>
                </div>

                <div>
                    <label for="producto-precio">Precio:</label>
                    <input type="number" id="producto-precio" placeholder="0.00" step="0.01" min="0" required>
                </div>

                <div>
                    <label for="producto-categoria">Categoría:</label>
                    <select id="producto-categoria" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="hogar">Hogar</option>
                        <option value="tecnologia">Tecnología</option>
                        <option value="deportes">Deportes</option>
                        <option value="jardineria">Jardinería</option>
                    </select>
                </div>

                <div>
                    <label for="producto-stock">Stock:</label>
                    <input type="number" id="producto-stock" placeholder="0" min="0" max="15" required>
                </div>

                <div>
                    <label for="producto-imagen">Imagen (ruta):</label>
                    <input type="text" id="producto-imagen" placeholder="img/producto.jpg" required>
                </div>

                <div>
                    <button type="submit" id="btn-crear">Crear Producto</button>
                    <button type="button" id="btn-actualizar" disabled>Actualizar Producto</button>
                    <button type="button" id="btn-cancelar" disabled>Cancelar Edición</button>
                </div>
            </form>
        </section>

        <!-- Buscador para el CRUD -->
        <section>
            <h3>Buscar Producto</h3>
            <input type="text" id="buscador-crud" placeholder="Buscar por nombre o ID...">
        </section>

        <!-- Tabla para LEER todos los productos -->
        <section>
            <h3>Listado de Productos</h3>
            <table border="1">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                        <th>Imagen</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-crud">
                    <tr>
                        <td colspan="7">Cargando productos...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>EcoShop - Todos los derechos reservados</p>
    </footer>
</body>
</html>
